[package]
name = "voicelink-pairing"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# This is the reviewed 1Password fork, NOT the unrelated crates.io packages
# named cpace / pake-cpace. Keep the full source revision in the lockfile.
pake-cpace = { git = "https://github.com/1Password/cpace", rev = "7e2e42c7d359969f4356292c2bd2cf3ff6eeeecc" }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
zeroize = "1.9.1"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = "1.29.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
