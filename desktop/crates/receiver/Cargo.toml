[package]
name = "voicelink-receiver"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.42.0", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
hmac = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
zeroize = "1.9.1"
thiserror = "2.0.21"
futures-channel = "0.3.34"

[dev-dependencies]
# Local image-input prototype only; not a production transport dependency.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory",
    "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops", "Win32_Security", "Win32_System_RemoteDesktop"
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_LibraryLoader"] }
