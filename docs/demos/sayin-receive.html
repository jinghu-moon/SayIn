    function notify(message){clearTimeout(toastTimer);const node=document.getElementById('toast');node.textContent=message;node.hidden=false;toastTimer=setTimeout(()=>node.hidden=true,3000);}
    async function copyOriginal(){try{const text=recordState==='submitted'?sample:pending;if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const previous=document.activeElement,field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:-9999px';document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();previous?.focus();if(!ok)throw new Error('Copy rejected');}notify(t('copied'));}catch{notify(t('copyFailed'));}}
    function focusAfterRender(id){render();(document.getElementById(id)||document.getElementById('connection'))?.focus({preventScroll:true});}
    document.addEventListener('click',event=>{
      const trigger=event.target.closest('button');if(!trigger)return;const id=trigger.id,nav=trigger.dataset.nav,stage=trigger.dataset.stage;
      if(stage){setStage(stage);document.querySelector(`[data-stage="${stage}"]`).focus({preventScroll:true});return;}
      if(nav==='history'||id==='history-link'){location.href='sayin-history-card.html';return;}if(nav==='devices'||nav==='settings'){openDialog(nav,trigger);return;}
      if(['connection-help','help','uncertain','held','network','storage'].includes(id)){openDialog(id,trigger);return;}
      if(id==='retry-network'){notify(t('stillOffline'));return;}
      if(id==='simulate'){
        if(networkBlocked()){restoreNetwork();return;}
        if(ui.stage==='first')ui.phase='approval';else ui.stage='connected';
        focusAfterRender(ui.stage==='first'?'approve':ui.issue||'toggle-receiving');return;
      }
      if(id==='approve'){ui.stage='connected';ui.phase=null;ui.paused=false;ui.issue=null;ui.empty=true;focusAfterRender('toggle-receiving');return;}
      if(id==='reject'){ui.phase='invite';focusAfterRender('show-code');return;}
      if(id==='refresh-invite'){ui.phase='invite';ui.code=false;focusAfterRender('show-code');return;}
      if(id==='show-code'){ui.code=!ui.code;syncPairingMethod();return;}
      if(id==='toggle-receiving'&&!ui.issue){ui.paused=!ui.paused;focusAfterRender(id);return;}
      if(id==='copy'){copyOriginal();return;}
      if(id==='record-details'){ui.details=!ui.details;focusAfterRender(id);return;}
      if(id==='theme'){themeChoice=ui.theme==='light'?'dark':'light';ui.theme=themeChoice;render();return;}
      if(id==='language'){ui.lang=ui.lang==='zh'?'en':'zh';languageChoice=ui.lang==='zh'?'zh-Hans':'en';render();return;}
      if(id==='dialog-close'||id==='dismiss'){dialog.close();return;}
      if(id==='confirm-review'&&document.getElementById('review-check')?.checked){ui.issue=null;ui.paused=false;render();dialog.close();notify(t('readyAfterReview'));return;}
      if(id==='simulate-expiry'){recordState='expired';ui.issue=null;ui.paused=true;render();dialog.close();return;}
    });
    document.getElementById('condition').addEventListener('change',event=>setCondition(event.target.value));
    document.getElementById('network-preview').addEventListener('change',event=>setNetworkMode(event.target.value));
    dialog.addEventListener('change',event=>{
      if(event.target.id==='review-check')document.getElementById('confirm-review').disabled=!event.target.checked;
      if(event.target.id==='appearance-choice'){themeChoice=event.target.value;ui.theme=themeChoice==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):themeChoice;render();}
      if(event.target.id==='language-choice'){languageChoice=event.target.value;ui.lang=(languageChoice==='system'?navigator.language:languageChoice).startsWith('zh')?'zh':'en';render();const origin=dialogTrigger;openDialog('settings',document.querySelector('[data-nav="settings"]'));dialogTrigger=origin;document.getElementById('language-choice').focus();}
    });
    dialog.addEventListener('close',()=>{const origin=dialogTrigger;const node=origin?.id?document.getElementById(origin.id):origin?.nav?document.querySelector(`[data-nav="${origin.nav}"]`):null;(node||document.getElementById('toggle-receiving')||document.querySelector(`[data-stage="${ui.stage}"]`))?.focus({preventScroll:true});});
    dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',event=>{if(themeChoice==='system'){ui.theme=event.matches?'dark':'light';render();}});
    render();

</script>
</body>
