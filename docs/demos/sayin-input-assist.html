.assist-header{display:flex;align-items:center;padding:0 8px;min-height:56px;border-bottom:1px solid var(--line);flex:none}
.assist-tabs{display:flex;flex:1;min-width:0;gap:2px}
.assist-tabs button{border:0;background:none;min-width:64px;min-height:48px;padding:6px 10px;font-size:16px;font-weight:650;color:var(--mute);position:relative}
.assist-tabs [aria-selected="true"]{color:var(--brand)}
.assist-tabs [aria-selected="true"]:after{content:"";position:absolute;height:3px;bottom:0;left:14px;right:14px;border-radius:2px;background:var(--brand)}
.assist-header .ib{width:48px;height:48px;flex:none}
.assist-editor-title{flex:1;font-size:16px;font-weight:650}
.assist-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 16px}
.assist-row{display:flex;position:relative;border-radius:16px;align-items:center;min-height:64px;margin-bottom:4px}
.assist-row:hover{background:var(--page)}
.assist-text{flex:1;min-width:0;border:0;background:none;text-align:left;min-height:56px;padding:12px;font-size:16px;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
.assist-text span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.assist-row>.ib{width:48px;height:48px;flex:none}
.assist-actions{position:absolute;right:8px;top:48px;z-index:2;min-width:150px;padding:4px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.14);border-radius:16px}
.assist-actions button{display:block;min-height:48px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-radius:12px;cursor:pointer}
.assist-actions button:hover{background:var(--page)}
.assist-empty{height:100%;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:var(--mute)}
.assist-empty>.i{width:32px;height:32px;color:var(--faint)}
.assist-empty p{font-size:13px;max-width:240px;line-height:1.6}
.assist-primary{min-height:48px;border:0;border-radius:24px;padding:10px 20px;background:var(--brand);color:var(--neutral-0);font-weight:600;cursor:pointer}
.assist-primary:disabled{opacity:.35;cursor:default}
.assist-field{display:flex;flex-direction:column;gap:8px;height:100%;padding:4px 8px}
.assist-field label{font-size:13px;color:var(--mute)}
.assist-field label{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.assist-field textarea{flex:1;min-height:70px;width:100%;resize:none;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--page);color:var(--fg);font:inherit;font-size:16px;line-height:1.6;outline-color:var(--brand)}
.assist-editor-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:26px;font-size:12px;color:var(--mute)}
.assist-error{color:var(--error)}
.assist-privacy{padding:4px 12px;color:var(--mute);font-size:12px}
.assist-footer{padding:0 16px 12px;flex:none}
.assist-footer>.assist-primary{width:100%}
.toast{z-index:12}
.assist button:active{transform:none}
@media(max-width:350px){.cf{grid-template-columns:repeat(5,minmax(48px,1fr))}.cf>.cnt{grid-column:1/-1;grid-row:1;padding-bottom:4px}.cf>.ib{grid-row:2}.cf>.vw{grid-row:1}}
@keyframes assist-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(max-height:560px){.assist-panel{height:calc(100% - 24px)}.demo p,.phone>.top,.phone>.nav,.col>.cp{display:none}}

@keyframes pop{40%{transform:scale(1.15)}}
@keyframes breathe{50%{opacity:.35;transform:scale(.88)}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}[data-lay="b"] .wf i{height:4px!important}}
